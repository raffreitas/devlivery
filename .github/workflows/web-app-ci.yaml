name: Web App CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-app-ci.yaml"
  pull_request:
    paths:
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web-app-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10

concurrency:
  group: web-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Build & Test React
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache pnpm packages
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Check filename casing
        working-directory: apps/web
        run: |
          duplicates=$(find src -type f \( -iname "*.tsx" -o -iname "*.ts" \) | \
            awk 'BEGIN{IGNORECASE=1} {count[tolower($0)]++; files[tolower($0)]=files[tolower($0)]" "$0} END{for(f in count) if(count[f]>1) print files[f]}')
          if [ -n "$duplicates" ]; then
            echo "Found case-sensitive duplicates:"
            echo "$duplicates"
            exit 1
          fi

      - name: Check Types
        working-directory: apps/web
        run: pnpm exec tsc -b

      - name: Build
        working-directory: apps/web
        run: pnpm run build
