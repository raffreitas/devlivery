name: Web App CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-app-ci.yaml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-app-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10
  SONAR_PROJECT_KEY: "devlivery-web"
  SONAR_ORGANIZATION: "raffreitas"

concurrency:
  group: web-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-analysis:
    name: Build and Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check filename casing
        working-directory: apps/web
        run: |
          duplicates=$(find src -type f \( -iname "*.tsx" -o -iname "*.ts" \) | \
            awk 'BEGIN{IGNORECASE=1} {count[tolower($0)]++; files[tolower($0)]=files[tolower($0)]" "$0} END{for(f in count) if(count[f]>1) print files[f]}')

          if [ -n "$duplicates" ]; then
            echo "Found case-sensitive duplicates:"
            echo "$duplicates"
            exit 1
          fi

      - name: Lint
        run: pnpm --filter @devlivery/web run lint

      - name: Check types
        run: pnpm --filter @devlivery/web exec tsc

      - name: Build
        run: pnpm --filter @devlivery/web run build

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: apps/web
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.sources=src
            -Dsonar.coverage.exclusions=**/*
