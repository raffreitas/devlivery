name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

# A serialized run computes the next version only after earlier merges are tagged.
# Closed PRs that were not merged get their own group so they never replace a pending release.
concurrency:
  group: ${{ github.event.pull_request.merged && 'release-tagging' || format('release-skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  version:
    if: github.event.pull_request.merged == true && github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/release-version.yaml

  create-release:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Create release tag and release
        uses: actions/github-script@v9
        env:
          NEXT_TAG: ${{ needs.version.outputs.next-tag }}
          EXISTING_TAG: ${{ needs.version.outputs.existing-tag }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const sha = pr.merge_commit_sha || (pr.head && pr.head.sha) || context.sha;
            const existingTag = process.env.EXISTING_TAG;
            const tagName = existingTag || process.env.NEXT_TAG;

            if (existingTag) {
              core.info(`PR commit is already tagged as ${tagName}`);
            } else {
              core.info(`Creating tag ${tagName}`);

              try {
                await github.rest.git.getRef({ owner, repo, ref: `refs/tags/${tagName}` });
                throw new Error(`Tag ${tagName} already exists and does not belong to PR #${pr.number}.`);
              } catch (err) {
                if (err.status !== 404) throw err;
                await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tagName}`, sha });
                core.info(`Created ref refs/tags/${tagName}`);
              }
            }

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag: tagName });
              core.info(`Release ${tagName} already exists`);
            } catch (err) {
              if (err.status !== 404) throw err;
              await github.rest.repos.createRelease({ owner, repo, tag_name: tagName, name: tagName, body: `Release from PR #${pr.number}: ${pr.title}`, draft: false, prerelease: false });
              core.info(`Created release ${tagName}`);
            }
