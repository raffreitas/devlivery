name: CI/CD Web API

on:
  push:
    branches: [ main ]
    paths:
      - "apps/api/**"
  pull_request:
    paths:
      - "apps/api/**"
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  ci:
    name: Build & Test .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet
          key: nuget-${{ runner.os }}-dotnet-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-dotnet-

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET packages
        working-directory: apps/api
        run: dotnet restore

      - name: Build .NET projects
        working-directory: apps/api
        run: dotnet build --no-restore --configuration Release --verbosity minimal

      - name: Run .NET tests
        working-directory: apps/api
        run: dotnet test --no-build --configuration Release --verbosity normal

  apply-migrations:
    name: Apply DB migrations
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dotnet tools & dependencies (Makefile)
        working-directory: apps/api
        run: make setup

      - name: Run EF migrations (Apply DB migrations)
        working-directory: apps/api
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.DATABASE_CONNECTION_STRING }}
          ASPNETCORE_ENVIRONMENT: Production
        run: make migrate-all
