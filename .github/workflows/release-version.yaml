name: Release Version

on:
  workflow_call:
    outputs:
      bump:
        description: SemVer marker found in the pull request.
        value: ${{ jobs.compute.outputs.bump }}
      next-tag:
        description: Tag the pull request will release.
        value: ${{ jobs.compute.outputs.next-tag }}
      existing-tag:
        description: SemVer tag already pointing to the pull request merge commit, if any.
        value: ${{ jobs.compute.outputs.existing-tag }}

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.version.outputs.bump }}
      next-tag: ${{ steps.version.outputs.next-tag }}
      existing-tag: ${{ steps.version.outputs.existing-tag }}
    steps:
      - name: Compute release version
        id: version
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('This workflow must run for a pull request event.');
              return;
            }

            const text = `${pr.title || ''}\n${pr.body || ''}`;
            const bumps = [...text.matchAll(/\[(major|minor|patch)\]/gi)]
              .map((match) => match[1].toLowerCase());

            if (bumps.length !== 1) {
              core.setFailed(
                bumps.length === 0
                  ? 'Add exactly one SemVer marker: [Patch], [Minor], or [Major], in the PR title or body.'
                  : 'Use exactly one SemVer marker: [Patch], [Minor], or [Major].'
              );
              return;
            }

            const bump = bumps[0];
            const { owner, repo } = context.repo;
            const tags = await github.paginate(github.rest.repos.listTags, { owner, repo, per_page: 100 });

            function parseSemver(tag) {
              const match = tag.match(/^v?(\d+)\.(\d+)\.(\d+)$/);
              if (!match) return null;
              return { major: Number(match[1]), minor: Number(match[2]), patch: Number(match[3]) };
            }

            let latest = { major: 0, minor: 0, patch: 0 };
            for (const tag of tags) {
              const version = parseSemver(tag.name);
              if (!version) continue;
              if (
                version.major > latest.major ||
                (version.major === latest.major && version.minor > latest.minor) ||
                (version.major === latest.major && version.minor === latest.minor && version.patch > latest.patch)
              ) {
                latest = version;
              }
            }
            core.info(`Latest tag: v${latest.major}.${latest.minor}.${latest.patch}`);

            if (bump === 'major') { latest.major += 1; latest.minor = 0; latest.patch = 0; }
            else if (bump === 'minor') { latest.minor += 1; latest.patch = 0; }
            else { latest.patch += 1; }

            const nextTag = `v${latest.major}.${latest.minor}.${latest.patch}`;
            const sha = pr.merge_commit_sha || (pr.head && pr.head.sha) || context.sha;
            const existingTag = tags.find((tag) => parseSemver(tag.name) && tag.commit.sha === sha);

            core.info(`SemVer bump: ${bump}. Next release tag: ${nextTag}`);
            await core.summary.addRaw(`## Release prevista\n\n**${nextTag}** (${bump})\n`).write();

            core.setOutput('bump', bump);
            core.setOutput('next-tag', nextTag);
            core.setOutput('existing-tag', existingTag ? existingTag.name : '');
