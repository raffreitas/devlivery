name: Build & Deploy

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "biome.json"
      - ".github/workflows/main-build-deploy.yml"

env:
  NODE_VERSION: "22"
  PNPM_VERSION: 9

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache pnpm packages
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check case-sensitive filename conflicts
        run: |
          echo "🔍 Checking for case-sensitive filename issues..."
          duplicates=$(find src -type f \( -iname "*.tsx" -o -iname "*.ts" \) | \
            awk 'BEGIN{IGNORECASE=1} {count[tolower($0)]++; files[tolower($0)]=files[tolower($0)]" "$0} END{for(f in count) if(count[f]>1) print files[f]}')
          if [ -n "$duplicates" ]; then
            echo "❌ Found case-sensitive duplicates:"
            echo "$duplicates"
            exit 1
          fi
          echo "✅ No case-sensitive conflicts found"

      - name: Run Biome (lint & format check)
        run: pnpm exec biome ci .

      - name: Type check with TypeScript
        run: pnpm exec tsc -b

      - name: Build project
        run: pnpm run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          echo "✅ Build successful"
          ls -lah dist/
