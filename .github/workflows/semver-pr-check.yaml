name: CI/CD PR Check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write

jobs:
  require-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR for SemVer tag
        uses: actions/github-script@v6
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            const text = ((pr.title || '') + ' ' + (pr.body || '')).toLowerCase();
            const has = /\[major\]|\[minor\]|\[patch\]/i.test(text);
            if (has) {
              core.info('SemVer bump tag found — OK');
              return;
            }
            core.info('No SemVer bump tag found — posting comment and failing');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const body = `Please include one of [Patch], [Minor], or [Major] in the PR title or body to indicate the SemVer bump. If omitted, the merge workflow will default to a patch bump.`;
            await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            throw new Error('Missing SemVer bump tag in PR title or body. Add [Patch] / [Minor] / [Major]');
