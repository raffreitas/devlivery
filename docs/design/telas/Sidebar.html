<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar (componente)</title>
<!-- Referência estática exportada do canvas de design do Devlivery. Não é código de produção: reconstrua com os componentes do app. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="_shared/tokens.css">
<link rel="stylesheet" href="_shared/app.css">
<link rel="stylesheet" href="_shared/components.css">
<style>

body{margin:0}
.sb-item{display:flex;align-items:center;gap:10px;height:30px;padding:0 8px;border-radius:var(--radius-md);color:var(--text-muted);font:500 13px/18px var(--font-sans);text-decoration:none}
.sb-item:hover{background:var(--surface-2);color:var(--text)}
.sb-item svg{width:16px;height:16px;flex:none}
.sb-item.on{background:var(--surface-3);color:var(--text)}
.sb-item .badge{margin-left:auto;font:500 11px/16px var(--font-sans);color:var(--text-muted)}
.sb-tool{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:var(--radius-md);border:1px solid var(--line);background:var(--surface-1);color:var(--text-muted);cursor:pointer}
.sb-tool svg{width:15px;height:15px}

</style>
</head>
<body>
<div id="root" style="min-height: 100vh;">

<nav aria-label="Principal" style="width: 240px; min-height: 100%; box-sizing: border-box; flex: 0 0 240px; display: flex; flex-direction: column; gap: 16px; padding: 14px 10px 12px 12px; background: var(--bg); color: var(--text); font-family: var(--font-sans);">
<div style="display: flex; align-items: center; gap: 8px; padding: 0px 2px;">
<button type="button" aria-label="Trocar estabelecimento" style="flex: 1 1 0%; min-width: 0px; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0px 6px; border: 0px; border-radius: var(--radius-md); background: transparent; color: var(--text); cursor: pointer; font: 600 13px/18px var(--font-sans);">
<svg width="20" height="20" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--surface-3)"></rect><path fill="var(--text)" fill-rule="evenodd" d="M15 15h12c9.4 0 16 7.2 16 17s-6.6 17-16 17H15Z M23 22.5h4c5 0 8.4 3.9 8.4 9.5s-3.4 9.5-8.4 9.5h-4Z"></path><circle cx="50.5" cy="45" r="4.5" fill="var(--brand)"></circle></svg>
<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Cantina do Bairro</span>
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color: var(--text-muted); flex: 0 0 auto;"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<a class="sb-tool" href="NovoPedido.html" aria-label="Novo pedido"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></a>
</div>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0px 8px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-1); color: var(--text-muted); font: 400 13px/18px var(--font-sans); cursor: pointer;">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="flex: 1 1 0%; text-align: left;">Buscar ou executar</span>
<span class="kbd">Ctrl K</span>
</button>
<div style="display: flex; flex-direction: column; gap: 1px;">
<span style="padding: 6px 8px 4px; font: 500 12px/16px var(--font-sans); color: var(--text-muted);">Operação</span>

<a href="Pedidos.html" class="sb-item on" aria-current="page">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h4"></path></svg>
<span>Pedidos</span>
<span class="badge">8</span>
</a>

<a href="Caixa.html" class="sb-item" aria-current="false">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v13H3zM3 7l3-4h12l3 4M16 13.5h2"></path></svg>
<span>Caixa</span>
<span class="badge"></span>
</a>

<a href="Dashboard.html" class="sb-item" aria-current="false">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
<span>Dashboard</span>
<span class="badge"></span>
</a>

<a href="Produtos.html" class="sb-item" aria-current="false">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"></path></svg>
<span>Produtos</span>
<span class="badge"></span>
</a>

<a href="Despesas.html" class="sb-item" aria-current="false">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h9l5 5v15H6zM14 2v6h6M9 14h8"></path></svg>
<span>Despesas</span>
<span class="badge">3</span>
</a>

</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
<a href="Caixa.html" style="display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-1); color: var(--text); text-decoration: none; font: 500 12px/16px var(--font-sans);">
<span style="width: 8px; height: 8px; border-radius: 50%; background: var(--status-delivered); border: 0px; box-sizing: border-box; flex: 0 0 auto;"></span>
<span style="flex: 1 1 0%;">Caixa aberto</span>
<span class="muted num" style="font-weight: 400;">desde 18:20</span>
</a>
<div style="display: flex; align-items: center; gap: 8px; padding: 4px 6px;">
<span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: var(--surface-3); color: var(--text); display: inline-flex; align-items: center; justify-content: center; font: 600 10px/1 var(--font-sans);">AL</span>
<span style="flex: 1 1 0%; font: 500 13px/18px var(--font-sans);">Ana Lima</span>
<button type="button" class="sb-tool" aria-label="Alternar tema" style="border: 0px; background: transparent;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg></button>
</div>
</div>
</nav>
</div>
</body>
</html>
