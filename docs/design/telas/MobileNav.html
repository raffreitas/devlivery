<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barra do celular (componente)</title>
<!-- Referência estática exportada do canvas de design do Devlivery. Não é código de produção: reconstrua com os componentes do app. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="_shared/tokens.css">
<link rel="stylesheet" href="_shared/app.css">
<link rel="stylesheet" href="_shared/components.css">
<style>

body{margin:0}
.mn a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;color:var(--text-muted);font:500 11px/14px var(--font-sans);text-decoration:none}
.mn a svg{width:22px;height:22px}
.mn a[aria-current="page"]{color:var(--text)}
.mn a[aria-current="page"] svg{color:var(--brand)}
.mn .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:var(--brand);color:var(--on-brand);font:700 10px/16px var(--font-sans);text-align:center}
.mn .new{width:48px;height:48px;border-radius:14px;background:var(--brand);color:var(--on-brand);display:inline-flex;align-items:center;justify-content:center}
.mn .new svg{width:24px;height:24px;color:var(--on-brand)}

</style>
</head>
<body>
<div id="root" style="min-height: 100vh;">

<nav class="mn" aria-label="Principal" data-theme="dark" style="width: 390px; box-sizing: border-box; display: grid; grid-template-columns: repeat(5, minmax(0px, 1fr)); align-items: center; padding: 4px 6px 10px; background: var(--surface-1); border-top: 1px solid var(--line); font-family: var(--font-sans);">
<a href="MPedidos.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h4"></path></svg>Pedidos<span class="badge">8</span></a>
<a href="Caixa.html" aria-current="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v13H3zM3 7l3-4h12l3 4M16 13.5h2"></path></svg>Caixa</a>
<a href="MNovoPedido.html" aria-label="Novo pedido"><span class="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span></a>
<a href="Dashboard.html" aria-current="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Resumo</a>
<a href="MMais.html" aria-current="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>Mais<span class="badge">1</span></a>
</nav>
</div>
</body>
</html>
